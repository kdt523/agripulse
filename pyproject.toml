[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agripulse"
version = "0.1.0"
description = "External-data lakehouse for agri demand forecasting (Databricks, PySpark, Delta Lake)"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31,<3",
  "tenacity>=8.2,<10",
  "pydantic>=2.5,<3",
  "pydantic-settings>=2.2,<3",
  "pandas>=2.1,<3",
  "shapely>=2.0,<3",
  "rapidfuzz>=3.6,<4",
  "lightgbm>=4.3,<5",
  "scikit-learn>=1.4,<2",
  "mlflow>=2.12",
]

[project.optional-dependencies]
dev = [
  "pyspark>=3.5,<4",
  "delta-spark>=3.2,<4",
  "chispa>=0.10",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.4",
  "mypy>=1.10",
  "pyyaml>=6",
  "types-requests",
  "types-PyYAML",
]
airflow = ["apache-airflow-providers-databricks>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs on Databricks (deselect locally)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 130
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["src/agripulse"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E501", "E402", "F821", "I001"]
"tests/*" = ["E501"]
"src/agripulse/transform/gold_district_week.py" = ["E501", "E731"]
"src/agripulse/transform/gold_docs.py" = ["E501"]
"pipelines/*" = ["E501", "E402", "F821", "I001"]
"src/agripulse/quality/freshness.py" = ["E501"]
"airflow/*" = ["E501", "F401"]
"src/agripulse/quality/catalog_export.py" = ["E501"]
"src/agripulse/ml/*" = ["E501"]
"src/agripulse/chaos/*" = ["E501", "S307"]
